<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGONI HR HUB</title>
    <link rel="stylesheet" href="dashboard.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="user-info">
                <h1>Hi, <span id="user-name">John</span> 👋</h1>
                <p><i class="fa-solid fa-location-dot"></i> <span id="user-location">Port Harcourt, Nigeria</span></p>
            </div>
            <div class="notification">
                <i class="fa-regular fa-bell"></i>
                <span class="dot"></span>
            </div>
        </header>

        <!-- Search Bar -->
        <section class="search-section">
            <div class="search-input">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search for a service or skill..." id="search-input">
            </div>
            <button class="filter-btn"><i class="fa-solid fa-sliders"></i></button>
        </section>

        <!-- Popular Categories (Skillful) -->
        <section class="section-header">
            <h3>Skillfull</h3>
            <a href="#" onclick="filterBySkill('all'); return false;">See All</a>
        </section>
        <div class="categories-grid">
            <div class="cat-item" onclick="filterBySkill('Plumber')"><div class="icon-box blue"><i class="fa-solid fa-faucet"></i></div><span>Plumber</span></div>
            <div class="cat-item" onclick="filterBySkill('Electrician')"><div class="icon-box orange"><i class="fa-solid fa-bolt"></i></div><span>Electrician</span></div>
            <div class="cat-item" onclick="filterBySkill('Carpenter')"><div class="icon-box gray"><i class="fa-solid fa-hammer"></i></div><span>Carpenter</span></div>
            <div class="cat-item" onclick="filterBySkill('Painter')"><div class="icon-box red"><i class="fa-solid fa-paint-roller"></i></div><span>Painter</span></div>
            <div class="cat-item" onclick="toggleMoreSkills()"><div class="icon-box dark"><i class="fa-solid fa-grip"></i></div><span>More</span></div>
        </div>

        <!-- More Skills Modal (Hidden by default) -->
        <div id="more-skills-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
            <div style="background: white; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto;">
                <h3>All Skills</h3>
                <button onclick="toggleMoreSkills()" style="float: right; background: none; border: none; font-size: 1.5em; cursor: pointer;">✕</button>
                <div id="all-skills-list" style="margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; clear: both;">
                    <!-- Skills will be populated here -->
                </div>
            </div>
        </div>

        <!-- Top Rated Professionals -->
        <section class="section-header">
            <h3>Professionals</h3>
            <a href="#" onclick="filterBySkill('all'); return false;">See All</a>
        </section>

        <div class="pro-list" id="professionals-list">
            <!-- Professionals will be loaded here dynamically -->
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <div class="nav-item active"><i class="fa-solid fa-house"></i><a href="dashboard.html"><span>Home</span></a></div>
            <div class="nav-item"><i class="fa-solid fa-briefcase"></i><a href="jobs.html"><span>Jobs</span></a></div>
            <div class="nav-add"><i class="fa-solid fa-plus"></i></div>
            <div class="nav-item"><i class="fa-solid fa-comment-dots"></i><span>Messages</span></div>
            <div class="nav-item"><i class="fa-solid fa-user"></i><span>Profile</span></div>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
let allProfessionals = [];
let filteredProfessionals = [];
let currentFilter = 'all';

document.addEventListener("DOMContentLoaded", async function() {
    // --- Supabase config ---
    const supabaseUrl = "https://prkvtxqhuvfbekapeltm.supabase.co";    
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBya3Z0eHFodXZmYmVrYXBlbHRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMDYzMzQsImV4cCI6MjA5Mjc4MjMzNH0.C5e7kPILz52eIQCuwwcg6cNLhA-hqyqRVmit5HR-0J0";
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    // Load logged-in user's profile
    function loadUserProfile() {
        const profile = localStorage.getItem('ogonijobhub_profile');
        if (profile) {
            try {
                const userData = JSON.parse(profile);
                
                // Safely get full_name and extract first name
                const fullName = userData.full_name && userData.full_name.trim() !== '' ? userData.full_name : 'User';
                const firstName = fullName.split(' ')[0];
                
                // Safely get location
                const lga = userData.lga && userData.lga.trim() !== '' ? userData.lga : 'Location';
                const state = userData.state && userData.state.trim() !== '' ? userData.state : 'Nigeria';
                
                document.getElementById('user-name').textContent = firstName;
                document.getElementById('user-location').textContent = lga + ', ' + state;
            } catch (e) {
                console.error('Error parsing profile:', e);
                document.getElementById('user-name').textContent = 'User';
                document.getElementById('user-location').textContent = 'Port Harcourt, Nigeria';
            }
        } else {
            // No profile found, redirect to login
            window.location.href = 'login.html';
        }
    }

    // Generate random rating between 4.5 and 5.0
    function generateRandomRating() {
        return (Math.random() * 0.5 + 4.5).toFixed(1);
    }

    // Generate random review count
    function generateRandomReviews() {
        return Math.floor(Math.random() * 200) + 50;
    }

    // Fetch professionals from database
    async function fetchProfessionals() {
        try {
            const { data: professionals, error } = await supabaseClient
                .from('users')
                .select('id, user_id, full_name, email, field, lga, state, experience')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('Supabase error:', error);
                throw error;
            }

            if (professionals && professionals.length > 0) {
                allProfessionals = professionals.map(pro => ({
                    ...pro,
                    rating: generateRandomRating(),
                    reviews: generateRandomReviews()
                }));
                filteredProfessionals = allProfessionals;
                displayProfessionals(filteredProfessionals);
                populateSkillsList();
            } else {
                console.log('No professionals found, showing demo data');
                showDemoData();
            }
        } catch (err) {
            console.error('Error loading professionals:', err);
            showDemoData();
        }
    }

    // Display professionals
    function displayProfessionals(professionals) {
        const professionalsList = document.getElementById('professionals-list');
        professionalsList.innerHTML = '';

        if (professionals.length === 0) {
            professionalsList.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #999; padding: 30px;">No professionals found in this category.</p>';
            return;
        }

        professionals.forEach((pro) => {
            const avatarUrl = `https://i.pravatar.cc/150?u=${pro.email || pro.user_id || pro.id}`;
            const field = pro.field || 'Skilled Professional';
            const location = (pro.lga || 'Location') + ', ' + (pro.state || 'Nigeria');
            
            const proCard = document.createElement('div');
            proCard.className = 'pro-card';
            proCard.innerHTML = `
                <img src="${avatarUrl}" alt="Pro" class="pro-img">
                <div class="pro-details">
                    <div class="pro-name">${pro.full_name || 'Professional'} <i class="fa-solid fa-circle-check badge"></i></div>
                    <p class="pro-title">${field}</p>
                    <div class="pro-rating"><i class="fa-solid fa-star" style="color: #FFB800;"></i> ${pro.rating} <span>(${pro.reviews} reviews)</span></div>
                    <p class="pro-loc"><i class="fa-solid fa-location-dot"></i> ${location}</p>
                </div>
                <div class="pro-actions">
                    <i class="fa-regular fa-heart heart-icon" data-pro-id="${pro.user_id || pro.id}"></i>
                    <button class="view-btn" onclick="viewProfile('${pro.user_id || pro.id}')">View Profile</button>
                </div>
            `;
            professionalsList.appendChild(proCard);
        });
    }

    // Populate all skills list
    function populateSkillsList() {
        const skillsSet = new Set();
        allProfessionals.forEach(pro => {
            if (pro.field && pro.field.trim() !== '') {
                skillsSet.add(pro.field);
            }
        });

        const skillsList = Array.from(skillsSet).sort();
        const allSkillsList = document.getElementById('all-skills-list');
        allSkillsList.innerHTML = '';

        if (skillsList.length === 0) {
            allSkillsList.innerHTML = '<p style="grid-column: 1/-1; color: #999;">No skills available yet</p>';
            return;
        }

        skillsList.forEach(skill => {
            const skillBtn = document.createElement('button');
            skillBtn.textContent = skill;
            skillBtn.onclick = () => { filterBySkill(skill); toggleMoreSkills(); };
            skillBtn.style.cssText = `
                padding: 10px;
                border: 1px solid #ddd;
                border-radius: 5px;
                background: white;
                cursor: pointer;
                font-weight: 500;
                transition: 0.3s;
            `;
            skillBtn.onmouseover = () => skillBtn.style.background = '#f0f0f0';
            skillBtn.onmouseout = () => skillBtn.style.background = 'white';
            allSkillsList.appendChild(skillBtn);
        });
    }

    // Filter by skill
    window.filterBySkill = function(skill) {
        currentFilter = skill;
        if (skill === 'all') {
            filteredProfessionals = allProfessionals;
        } else {
            filteredProfessionals = allProfessionals.filter(pro => 
                pro.field && pro.field.toLowerCase() === skill.toLowerCase()
            );
        }
        displayProfessionals(filteredProfessionals);
    };

    // Toggle More Skills Modal
    window.toggleMoreSkills = function() {
        const modal = document.getElementById('more-skills-modal');
        modal.style.display = modal.style.display === 'none' ? 'flex' : 'none';
    };

    // Close modal when clicking outside
    document.getElementById('more-skills-modal').addEventListener('click', function(e) {
        if (e.target === this) {
            this.style.display = 'none';
        }
    });

    // Search functionality
    document.getElementById('search-input').addEventListener('input', function(e) {
        const searchTerm = e.target.value.toLowerCase();
        filteredProfessionals = allProfessionals.filter(pro => {
            const name = (pro.full_name || '').toLowerCase();
            const skill = (pro.field || '').toLowerCase();
            return name.includes(searchTerm) || skill.includes(searchTerm);
        });
        displayProfessionals(filteredProfessionals);
    });

    // Heart icon toggle
    document.addEventListener('click', function(e) {
        if (e.target.classList.contains('heart-icon')) {
            e.target.classList.toggle('fa-regular');
            e.target.classList.toggle('fa-solid');
            e.target.style.color = e.target.classList.contains('fa-solid') ? '#e74c3c' : '#000';
        }
    });

    // View profile
    window.viewProfile = function(userId) {
        console.log('Viewing profile for user:', userId);
        // Redirect to profile page
        // window.location.href = 'profile.html?id=' + userId;
    };

            {

            },
            { 
                id: '5',

            },
            { 
                id: '6',
                user_id: '6', 
                full_name: 'Grace Nwosu', 
                field: 'Fashion Designer', 
                lga: 'Gokana', 
                state: 'Rivers State', 
                email: 'grace@example.com',
                experience: 4
            },
            { 
                id: '7',
                user_id: '7',

            },
            {

            },
            {

            },
            { 
                id: '10',

                field: 'Nurse',

            }
        ];

        allProfessionals = demoCards.map(pro => ({
            ...pro,
            rating: generateRandomRating(),

        }));
        filteredProfessionals = allProfessionals;
        displayProfessionals(filteredProfessionals);
        populateSkillsList();
    }

    // Initialize
    loadUserProfile();
    fetchProfessionals();
});
    </script>
</body>
</html>
