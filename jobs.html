<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jobs | OGONI HR HUB</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/jobs.css">
</head>
<body>
  <div class="jobs-container">
    <!-- Header -->
    <div class="jobs-header">
      <div class="header-content">
        <h1>Jobs Board</h1>
        <p>Find your next opportunity</p>
      </div>
    </div>

    <!-- Search & Filter Section -->
    <div class="search-filter-section">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <input type="text" id="job-search-input" placeholder="Search by job title...">
      </div>
      <button class="search-btn" id="job-search-btn">Search</button>
    </div>

    <!-- Jobs List -->
    <div class="jobs-content">
      <div class="section-title">Available Positions</div>
      <div class="jobs-list" id="jobs-list">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Loading jobs...</p>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <button class="nav-btn" data-page="home">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
        <span>Home</span>
      </button>
      <button class="nav-btn active" data-page="jobs">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M4 7V6a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v1"/>
          <rect x="3" y="7" width="18" height="14" rx="2"/>
          <path d="M16 21v-4a4 4 0 0 0-8 0v4"/>
        </svg>
        <span>Jobs</span>
      </button>
      <button class="nav-btn create-btn" data-page="post">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="12" r="10" fill="currentColor"/>
          <path d="M12 8v8M8 12h8" stroke="white" stroke-width="2"/>
        </svg>
      </button>
      <button class="nav-btn" data-page="messages">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
        </svg>
        <span>Messages</span>
      </button>
      <button class="nav-btn" data-page="profile">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="8" r="4"/>
          <path d="M12 14c-4.41 0-8 2.69-8 6v2h16v-2c0-3.31-3.59-6-8-6z"/>
        </svg>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="jobs.js"></script>
</body>
</html>
